# =============================================================================
# picom.conf — Soft glass composition for the generated i3 themes.
#
# Picom 10+ GLX blur keeps terminal glyphs opaque while blurring backgrounds.
# Copyright (c) 2026 Temesgen Ataro <ataro.temesgen@gmail.com>
# SPDX-License-Identifier: Apache-2.0
# =============================================================================
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;
detect-client-opacity = true;

corner-radius = 16;
rounded-corners-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "fullscreen"];

shadow = true;
shadow-radius = 28;
shadow-opacity = 0.38;
shadow-offset-x = -24;
shadow-offset-y = -20;
shadow-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS@:c"];

# Workspace changes remain immediate; blur and geometry provide the depth.
fading = false;
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;
blur-background-exclude = ["window_type = 'desktop'", "fullscreen"];

# Do not fade text or make every application translucent.
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
opacity-rule = ["100:fullscreen"];

wintypes:
{
  dock = { shadow = false; };
  desktop = { shadow = false; };
  notification = { shadow = true; };
};
