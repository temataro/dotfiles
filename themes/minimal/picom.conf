# =============================================================================
# picom.conf — Blur-free composition for the minimal theme finish.
#
# Keeps tear-free vsync and the latency choices of the baseline picom config,
# and drops the decorative effects: no blur, no fade, no dimming, no rounding.
# Copyright (c) 2026 Temesgen Ataro <ataro.temesgen@gmail.com>
# SPDX-License-Identifier: Apache-2.0
# =============================================================================
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;
detect-rounded-corners = true;
detect-client-opacity = true;

# Square corners: rounding is the one effect that reads as decoration here.
corner-radius = 0;

# A short, tight shadow keeps window edges readable without a halo.
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.30;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = ["window_type = 'dock'", "window_type = 'desktop'",
                  "class_g = 'i3bar'", "_GTK_FRAME_EXTENTS@:c"];

fading = false;
blur-method = "none";
blur-background = false;

# No opacity rules of our own. detect-client-opacity stays on, so a window
# that asks for its own alpha (ARGB visuals, _NET_WM_WINDOW_OPACITY) is still
# drawn translucent.
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

wintypes:
{
  tooltip = { shadow = false; };
  menu = { shadow = false; };
  dropdown_menu = { shadow = false; };
  popup_menu = { shadow = false; };
  utility = { shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  notification = { shadow = true; };
};
