name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check themes and Makefile
      run: |
        make check
        make deps
        make --dry-run deploy
        make --dry-run desktop-deps
