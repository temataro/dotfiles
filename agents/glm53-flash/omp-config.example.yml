modelRoles:
  default: dgx-glm/glm-5.3-flash:max
  smol: dgx-glm/glm-5.3-flash:max
  slow: dgx-glm/glm-5.3-flash:max
  plan: dgx-glm/glm-5.3-flash:max
enabledProviders: []
disabledProviders:
  - claude
  - claude-plugins
  - omp-plugins
  - agent-plugins
  - skillshare
  - omp-managed
providers:
  cacheWarming: off
  streamFirstEventTimeoutSeconds: 1800
  streamIdleTimeoutSeconds: 300
skills:
  enableAgentsUser: false
  customDirectories: [] # filled by configure-omp.py, including nested skill roots
task:
  maxConcurrency: 1
  maxRecursionDepth: 1
  speculativeLaunch: false
