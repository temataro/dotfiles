##############################################################################
# keyd.conf — system-level key remaps (keyd 2.5+, evdev level, all keyboards)
# Deploys to /etc/keyd/default.conf (root-owned):
#   sudo cp keyd.conf /etc/keyd/default.conf && sudo systemctl restart keyd
# NOTE: Debian/Ubuntu rename the CLI to `keyd.rvaiya` (upstream docs say
# `keyd reload` / `keyd monitor` — use keyd.rvaiya, or symlink it to keyd).
# Panic exit if a config ever bricks input: Backspace+Escape+Enter kills keyd.
##############################################################################

[global]
# The Copilot chord members arrive <=9ms apart (measured via xev on the
# S5606CA). 15ms catches them while keeping real leftshift/leftmeta latency
# negligible (keyd only delays a chord member until the window closes or a
# non-member key arrives, whichever is first).
chord_timeout = 15

[ids]
*

[main]
# ASUS Copilot key (where Right Ctrl belongs): firmware fakes a sustained
# leftmeta+leftshift+f23 chord. Bind the chord as one key -> real Right Ctrl,
# held as long as the physical key is held; the fake mods are fully swallowed.
# If a future BIOS makes the chord tap-only (no hold state), use instead:
#   leftmeta+leftshift+f23 = oneshot(control)
leftmeta+leftshift+f23 = rightcontrol

# CapsLock as another Ctrl. (keyd owns this outright — the old setxkbmap
# ctrl:nocaps line was dropped from the i3 config.)
capslock = leftcontrol

# F4 types 5 — the 5 key is broken on one keyboard. Shift+F4 gives % for free.
f4 = 5
