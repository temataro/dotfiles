##############################################################################
# picom.conf — compositor for i3 (picom v12+)
# Deploys to ~/.config/picom/picom.conf
# Tuned latency-first for a 2880x1800@120 OLED: no fades, no inactive-window
# dimming, fullscreen windows bypass the compositor. Blur only ever touches
# explicitly transparent windows (the floating kitty). Every cut visual lever
# is kept below as a comment for easy re-enable. If picom fails to start,
# switch backend to "xrender" and remove the blur block (dual_kawase needs glx).
##############################################################################

#-- Backend ------------------------------------------------------------------
backend = "glx";
vsync = true;                # tear-free; at 120Hz the wait is <=8ms, not <=16
use-damage = true;
unredir-if-possible = true;  # fullscreen apps hit the panel directly, zero compositor latency
detect-rounded-corners = true;
detect-client-opacity = true;

#-- Rounded corners ----------------------------------------------------------
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3bar'"
];

#-- Shadows ------------------------------------------------------------------
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3bar'",
  "_GTK_FRAME_EXTENTS@"
];

#-- Fading -------------------------------------------------------------------
# Off: i3 workspace switches unmap/remap every window, so any fade turns a
# workspace switch into a ~120ms animation. Instant is the point.
# For a *fast* fade instead: fading = true; fade-in-step = 0.28;
# fade-out-step = 0.28; fade-delta = 3;
fading = false;

#-- Blur (behind translucent windows) ---------------------------------------
# With inactive-opacity = 1.0 the only translucent window left is the floating
# kitty (background_opacity 0.45), so dual_kawase now costs nothing elsewhere.
blur: {
  method = "dual_kawase";
  strength = 5;
};
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3bar'"
];

#-- Transparency / opacity ---------------------------------------------------
# inactive-opacity 1.0: the old 0.92 dim made picom blend (and blur) most of a
# 5-megapixel frame continuously and hazed unfocused text. Restore 0.92 for
# the dimmed look if you miss it — it costs latency on this panel.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
focus-exclude = [
  "class_g = 'rofi'",
  "class_g = 'flameshot'",
  "fullscreen"
];

# Keep media/browsers fully opaque regardless of focus.
opacity-rule = [
  "100:class_g = 'firefox'",
  "100:class_g = 'chromium'",
  "100:fullscreen"
];

#-- Window-type tweaks (correctly nested under wintypes; the old config had
#-- these at top level, where picom silently ignored them) -------------------
wintypes:
{
  tooltip       = { fade = true; shadow = false; opacity = 0.9; focus = true; };
  menu          = { shadow = false; };
  dropdown_menu = { shadow = false; };
  popup_menu    = { shadow = false; };
  utility       = { shadow = false; };
  dock          = { shadow = false; };
  dnd           = { shadow = false; };
  notification  = { shadow = true; };
};
